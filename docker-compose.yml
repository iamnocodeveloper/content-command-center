# Content Command Center · despliegue con Docker Compose
#
#   cp .env.example .env        # rellena al menos CRON_SECRET
#   docker compose up -d --build
#   open http://localhost:3000
#
# El volumen `ccc-data` sobre /app/.data es lo que hace persistentes las
# credenciales guardadas desde /settings. Sin él se pierden al recrear el
# contenedor (usa variables de entorno en ese caso).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: content-command-center:latest
    container_name: content-command-center
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Zona horaria del contenedor: afecta a `new Date()` y a los cron del host.
      TZ: ${TZ:-America/Mexico_City}
      DATA_DIR: .data

      # --- Zernio ---
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_PROFILE_ID: ${ZERNIO_PROFILE_ID:-}
      ZERNIO_DEFAULT_TIMEZONE: ${ZERNIO_DEFAULT_TIMEZONE:-America/Mexico_City}

      # --- Modo de datos: true = sólo datos semilla ---
      DEMO_MODE: ${DEMO_MODE:-true}

      # --- Modelo de IA ---
      CAPTION_PROVIDER: ${CAPTION_PROVIDER:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}

      # --- Transcripción ---
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-mock}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}

      # --- Protección de /api/cron/* ---
      CRON_SECRET: ${CRON_SECRET:?define CRON_SECRET en .env}
    volumes:
      - ccc-data:/app/.data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ccc-data:
    driver: local
