name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones antiguas del mismo ref si se empuja de nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Atribución · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # check = typecheck + lint + atribución + validación de los SVG.
      - name: Checks
        run: npm run check

      # build dispara prebuild (atribución en fuente) y postbuild (en el bundle).
      - name: Build
        run: npm run build
        env:
          # El build no necesita credenciales: la configuración se resuelve en
          # runtime. Estas variables sólo evitan que intente usar valores reales.
          DEMO_MODE: "true"
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    # Sólo se construye la imagen en main, para no gastar minutos en cada PR.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t content-command-center:ci .
